---
borgmatic_config_encryption_passphrase: "{{ _vault_borgmatic_config_encryption_passphrase }}"

borgmatic_config_source_directories:
  - "/home/vaultwarden/stacks/vaultwarden"

borgmatic_config_postgresql_databases:
  - name: "vaultwarden"
    username: "vaultwarden"
    pg_dump_command: "run0 --user=vaultwarden podman exec vaultwarden-postgres pg_dump"
    pg_restore_command: "run0 --user=vaultwarden podman exec -i vaultwarden-postgres pg_restore"
    psql_command: "run0 --user=vaultwarden podman exec -i vaultwarden-postgres psql"
