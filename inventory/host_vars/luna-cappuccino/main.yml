---
borgmatic_config_source_directories:
  - "/home/cappuccino/stacks/cappuccino"

borgmatic_config_exclude_patterns:
  - "/home/cappuccino/stacks/cappuccino/data/postgres"

borgmatic_config_postgresql_databases:
  - name: "cappuccino"
    username: "cappuccino"
    pg_dump_command: "run0 --user=cappuccino podman exec cappuccino-postgres pg_dump"
    pg_restore_command: "run0 --user=cappuccino podman exec -i cappuccino-postgres pg_restore"
    psql_command: "run0 --user=cappuccino podman exec -i cappuccino-postgres psql"
